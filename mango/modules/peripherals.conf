# Monitors
monitorrule = name:^eDP-1$, width: 1920, height: 1200, x:760, y:1440, layout:dwindle
monitorrule = name:^DP-2$, width: 3440, height: 1440, x:0, y:0, layout:center_tile

# Keyboard
repeat_rate=25
repeat_delay=600
numlockon=0
xkb_rules_layout=us

# Trackpad
# Need logout/login to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# Mouse
# Need logout/login to make it apply
mouse_natural_scrolling=1
