# Animation Configuration

# Enabling Animations
animations                          = 1 # Enable window animations
layer_animations                    = 1 # Enable layer shell animations

# Animation Types
animation_type_open                 = "zoom" # Animation style for opening windows (slide, zoom, fade, none)
animation_type_close                = "slide" # Animation style for closing windows (slide, zoom, fade, none)
layer_animation_type_open           = "slide" # Animation style for opening layer surfaces
layer_animation_type_close          = "slide" # Animation style for closing layer surfaces

# Fade Settings
animation_fade_in                   = 1 # Enable fade-in effect (0: disable, 1: enable)
animation_fade_out                  = 1 # Enable fade-out effect (0: disable, 1: enable)
fade_in_begin_opacity               = 0.5 # Starting opacity for fade-in animations (0.0-1.0)
fade_out_begin_opacity              = 0.5 # Starting opacity for fade-out animations (0.0-1.0)

# Zoom Settings
zoom_initial_ratio                  = 0.4 # Initial zoom ratio
zoom_end_ratio                      = 0.8 # End zoom ratio

# Durations
animation_duration_move             = 500 # Move animation duration (ms)
animation_duration_open             = 400 # Open animation duration (ms)
animation_duration_tag              = 300 # Tag animation duration (ms)
animation_duration_close            = 300 # Close animation duration (ms)
animation_duration_focus            = 0 # Focus change (opacity transition) animation duration (ms)

# Custom Bezier Curves
animation_curve_open                = "0.46, 1.00 ,0.29 ,0.99" # Open animation bezier curve
animation_curve_move                = "0.46, 1.00, 0.29 ,0.99" # Move animation bezier curve
animation_curve_tag                 = "0.46, 1.00, 0.29, 0.99" # Tag animation bezier curve
animation_curve_close               = "0.46, 1.00, 0.29, 0.99" # Close animation bezier curve
animation_curve_focus               = "0.46, 1.00, 0.29, 0.99" # Focus change (opacity transition) animation bezier curve
animation_curve_opacity_fade_in     = "0.46, 1.00, 0.29, 0.99" # Open opacity animation bezier curve
animation_curve_opacity_fade_out    = "0.50, 0.50 ,0.50 ,0.50" # Close opacity animation bezier curve

# Tag Animation Direction
tag_animation_direction = 1 # Tag animation direction (1: horizontal, 0: vertical)


