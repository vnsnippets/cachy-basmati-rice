# # Supported Layouts:
# # - tile
# # - scroller
# # - grid
# # - deck
# # - monocle
# # - center_tile
# # - vertical_tile
# # - vertical_scroller

# # Override specific tags with
tag_rule=id:*,layout_name:scroller
tag_rule=id:1,layout_name:dwindle

# # MPV: Float
window_rule=app_id:mpv,is_floating:1,width:960,height:720,animation_type_open:zoom,animation_type_close:zoom

# Nautilus: Float
window_rule=app_id:Nautilus,is_floating:1,width:960,height:720,animation_type_open:zoom,animation_type_close:zoom
window_rule=app_id:xdg-desktop-portal-gtk,width:960,height:600,animation_type_open:zoom,animation_type_close:zoom

window_rule=app_id:thunar,is_floating:1,width:960,height:720,animation_type_open:zoom,animation_type_close:zoom

# Pavucontrol: Float
# window_rule=app_id:pavucontrol,is_floating:1,width:960,height:600,animation_type_open:zoom,animation_type_close:zoom

# NWG Look: Float
# window_rule=app_id:nwg-look,is_floating:1,width:960,height:600,animation_type_open:zoom,animation_type_close:zoom

# Satty, Grim, Slurp
window_rule=app_id:com.gabm.satty,no_swallow:1,is_fullscreen:0,is_floating:1,animation_type_open:zoom,animation_type_close:zoom

# Firefox
window_rule=title:Picture-in-Picture,app_id:firefox,width:480,height:270,no_swallow:1,is_fullscreen:0,is_floating:1,offset_x:-98,offset_y:-97,animation_type_open:zoom,animation_type_close:zoom
window_rule=title:Library,app_id:firefox,width:960,height:600,is_floating:1,animation_type_open:zoom,animation_type_close:zoom

