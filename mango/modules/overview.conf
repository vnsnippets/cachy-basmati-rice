# Overview
overview_gap_inner = 5 # Gap between cards. Range: 0–1000.
overview_gap_outer = 30 # Gap between the card grid and the monitor edges. Range: 0–1000.
enable_hotarea = 0 # Enter the standard overview when the pointer enters the configured corner (0: disabled, 1: enabled).
hotarea_size = 10 # Width and height of the hot-area trigger in pixels. Range: 1–1000.
hotarea_corner = 2 # Trigger corner: 0 top-left, 1 top-right, 2 bottom-left, 3 bottom-right.
hotarea_disable_on_fullscreen = 1 # Do not trigger the hot area while a fullscreen window is focused (0: disabled, 1: enabled).

# Jump Mode
jump_labels = "HJKLASDFGQWERTYUIOPZXCVBNM" # Ordered characters assigned as window hints.

# Overcircle
overcircle_center_ratio = 0.5 # Width of the centered focused window as a fraction of the usable screen width. Range: 0.1–0.9.

# Title Message Bar (Shared with Overcircle & Switcher)
title_message_bar_height = 52 # Title message bar height. Set to 0 to disable it.
title_message_bar_gap = 20 # Gap between the bar and the focused overview card or switcher panel.