#Environment variables
env = ZDOTDIR,/home/vnsnippets/.config/zsh
env = EDITOR,micro

# env = DOTNET_ROOT,/usr/bin/dotnet
# env = PATH, $PATH:/usr/bin/dotnet:/usr/bin/dotnet/tools
# env = GTK_CSD,0

source = ./modules/cursor.conf

source = ./modules/animations.conf
source = ./modules/monitors.conf
source = ./modules/appearance.conf
source = ./modules/devices.conf
source = ./modules/rulesets.conf
source = ./modules/keybinds.conf
source = ./modules/miscellaneous.conf

source = ./layouts/dwindle.conf
source = ./layouts/master.conf
source = ./layouts/overview.conf
source = ./layouts/scroller.conf

# Disable screen when lid is closed
# switchbind=fold,spawn,wlr-randr --output eDP-1 --off
switchbind=fold, disable_monitor, eDP-1

# Enable screen when lid is opened
# switchbind=unfold,spawn,wlr-randr --output eDP-1 --on
switchbind=unfold, enable_monitor, eDP-1

exec-once = /home/vnsnippets/.config/mango/scripts/autostart.sh
