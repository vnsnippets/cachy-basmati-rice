# Foot terminal configuration (Updated Format)

shell=zsh

font=Liberation Mono:size=11:antialias=true:hinting=slight
# Note: Foot doesn't use percentages for cell height. 
# Adjust line-height in pixels to get the spacing you like.
line-height=18
letter-spacing=0

# [environment]

[bell]
urgent=no
notify=no
visual=no

# [scrollback]
# Fixes error 1: 'indicator-style' is invalid.
# Foot hides the scrollbar if no position/format is defined.
# lines=1000

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

# Fixes error 3: [colors] is deprecated. Use [colors-dark] instead.
[colors-dark]
alpha=0.96
foreground=c6d0f5
background=1e1e2e

# Fixes error 2: Cursor color belongs in the colors section now.
# Format: cursor=<text-color> <cursor-color>
cursor=303446 f2d5cf  

# Selection colors (Format: <text> <background>)
selection-foreground=303446
selection-background=f2d5cf

# URL color
urls=f2d5cf

## The 16 terminal colors
# black
regular0=51576d
bright0=626880

# red
regular1=e78284
bright1=e78284

# green
regular2=a6d189
bright2=a6d189

# yellow
regular3=e5c890
bright3=e5c890

# blue
regular4=8caaee
bright4=8caaee

# magenta
regular5=f4b8e4
bright5=f4b8e4

# cyan
regular6=81c8be
bright6=81c8be

# white
regular7=b5bfe2
bright7=a5adce

[csd]
# Gives you a borderless window matching your kitty preferences
preferred=none

[main]
# Window padding/margins
pad=20x20

[key-bindings]
