general {
    # Avoid spawning duplicate lock screens
    lock_cmd = pidof hyprlock || hyprlock 
    before_sleep_cmd = loginctl lock-session 
    after_sleep_cmd = hyprctl dispatch dpms on 
}

# 30 Seconds: Smoothly dim brightness down to 10%
listener {
    timeout = 30
    on-timeout = brightnessctl --save --exponent=4 set 10%
    on-resume = brightnessctl --restore --exponent=2
}

# 60 Seconds: Lock the laptop session
listener {
    timeout = 60
    on-timeout = loginctl lock-session
}

# 90 Seconds: Power off the display output (DPMS)
listener {
    timeout = 90
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 120 Seconds: Suspend the system completely
listener {
    timeout = 120
    on-timeout = systemctl suspend
}